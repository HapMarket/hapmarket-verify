# Publishes @hapmarket/verify to npm when a version tag is pushed, via GitHub
# OIDC "trusted publishing" — no npm token. npm authenticates as this repo's
# workflow identity against the trusted publisher configured for the package on
# npmjs, and attaches provenance automatically, tying the tarball to this commit
# in this public repo so a consumer can confirm it was built from the source
# they can read. Actions are pinned to a commit, as in ci.yml.
#
# The same offline checks ci.yml runs gate the publish: a tag never ships code
# that would fail CI. prepack (npm run build) emits dist/ into the tarball.
#
# Requires, one-time, on npmjs: a trusted publisher on @hapmarket/verify naming
# this repo (HapMarket/hapmarket-verify) and this workflow (release.yml). Until
# that is configured the publish step fails with an auth error. No NPM_TOKEN
# secret is used; id-token: write below is what lets npm mint the OIDC token.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 24's bundled npm may
      # be older, so install a recent one.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:deps
      - run: npm run check:spec
      # The tag must match the version in package.json, so a tag can never ship
      # a different version than it names.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg"; exit 1; }
      # prepack runs the build. Provenance is automatic under trusted publishing.
      - run: npm publish --provenance --access public
